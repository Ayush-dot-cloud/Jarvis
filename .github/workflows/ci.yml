name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system audio deps for PyAudio
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev libasound2-dev espeak

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Compile-check all modules
        run: python -m compileall -q jarvis tests

      - name: Run pytest
        run: pytest -q
